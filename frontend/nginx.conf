server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API goes through the same origin, so it works from any host/IP without CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Angular handles routing in the browser: unknown paths load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
